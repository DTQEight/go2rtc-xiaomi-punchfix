name: Build and push image

# 触发方式：
#   - 推送到 main：构建并推送 latest / main / 1.9.13-punchfix
#   - 推送 v* 标签：构建并推送该标签 + latest
#   - 手动运行：Actions 页面点 Run workflow
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  GO2RTC_VERSION: v1.9.13
  IMAGE_NAME: go2rtc-xiaomi-punchfix

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=1.9.13-punchfix
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ci
          platforms: linux/amd64
          push: true
          build-args: |
            GO2RTC_VERSION=${{ env.GO2RTC_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
